name: Update profile art

# Refreshes the contribution graph SVG daily from real GitHub data.
# Also runs on push to main and on-demand.

"on":
  schedule:
    - cron: "30 17 * * *"   # ~17:30 UTC every day (11:00 PM IST)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data
        env:
          GH_PROFILE_USER: poriyavaibhav2611
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph SVG
        run: python scripts/generate_streak_svg.py poriyavaibhav2611 contrib-heatmap.svg

      - name: Generate wordmark
        env:
          WORDMARK_TEXT: VAIBHAV
        run: python scripts/make_wordmark_svg.py --mode rock --out wordmark.svg

      - name: Generate avatar ASCII art
        run: |
          python scripts/fetch_avatar.py poriyavaibhav2611
          python scripts/prep_photo.py
          python scripts/make_ascii_svg.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated art
        run: |
          git config --global user.name "Vaibhav Poriya"
          git config --global user.email "poriyavaibhav2611@gmail.com"
          git add data/contributions.json contrib-heatmap.svg wordmark.svg source-photo.jpg source-prepped.png vaibhav-ascii.svg
          git commit -m "chore: refresh profile art [skip ci]" || echo "No changes to commit"
          git push
